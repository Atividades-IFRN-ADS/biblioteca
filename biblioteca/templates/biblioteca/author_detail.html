<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ author.name }} | Biblioteca</title>
</head>
<body>
    <h1>{{ author.name }}</h1>
    {% if author.nationality %}
        <p>Nacionalidade: {{ author.nationality }}</p>
    {% endif %}
    <h2>Livros</h2>
    <ul>
        {% for book in author.books.all %}
            <li>{{ book.title }} ({{ book.year }})</li>
        {% empty %}
            <li>Nenhum livro cadastrado para este autor.</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'listar_livros' %}">Voltar à lista de livros</a></p>
</body>
</html>
